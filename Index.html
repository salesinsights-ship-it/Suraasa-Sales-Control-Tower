<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Suraasa Sales Control Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e2e8f0; --line2:#eef2f7;
  --brand:#1d4ed8; --brand-d:#1a43c0; --brand-l:#eff4ff; --side:#0f1b33; --side2:#1a2947;
  --green:#15803d; --green-l:#e8f6ec; --amber:#b45309; --amber-l:#fdf3e1; --red:#b91c1c; --red-l:#fdecec;
  --slate-l:#eef2f7; --violet:#6d28d9; --violet-l:#f1ebfe; --r:10px; --sh:0 1px 2px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);color:#cbd5e1;flex:none;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:10px;align-items:center}
.brand img{width:30px;height:30px;border-radius:7px;background:#fff;object-fit:contain;padding:3px;flex:none}
.brand b{display:block;color:#fff;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#8fa3c7}
.nav{padding:10px;flex:1;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#c3cee3;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--side2);color:#fff}
.nav button.on{background:#2447a8;color:#fff}
.nav svg{width:17px;height:17px;flex:none;opacity:.9}
.nav .count{margin-left:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-weight:600}
.who{padding:12px 14px 10px;border-top:1px solid rgba(255,255,255,.08)}
.who .p{display:flex;gap:10px;align-items:center}
.who .p div{min-width:0}
.who b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{color:#8fa3c7;font-size:11px}
.who .links{display:flex;gap:6px;margin-top:9px}
.who .links button{flex:1;border:1px solid rgba(255,255,255,.16);background:none;color:#c3cee3;border-radius:6px;padding:5px 4px;font-size:11.5px;cursor:pointer}
.who .links button:hover{background:var(--side2);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .menu-btn{display:none}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
#bar{position:fixed;left:0;top:0;height:3px;background:var(--brand);width:0;z-index:99;transition:width .25s}
#bar.on{width:82%;transition:width 5s cubic-bezier(.1,.7,.2,1)}
.content{padding:22px 26px 60px;max-width:1380px;width:100%}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-d)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:none;padding:5px 8px;color:var(--ink2)}
.btn.ghost:hover{background:var(--slate-l)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.block{width:100%;padding:10px 14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.red-t{color:var(--red)}
.btn:focus-visible,.nav button:focus-visible,a:focus-visible,.pcard:focus-visible{outline:2px solid #93b4ff;outline-offset:1px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 16px;box-shadow:var(--sh)}
.kpi small{color:var(--muted);font-size:12px;font-weight:500}
.kpi b{display:block;font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi.t-red b{color:var(--red)} .kpi.t-green b{color:var(--green)} .kpi.t-blue b{color:var(--brand)} .kpi.t-amber b{color:var(--amber)}
.cols2{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
.cols3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0;box-shadow:var(--sh)}
.card h3{font-size:14px;margin-bottom:12px}
.card h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;flex:1}
.welcome{margin-bottom:16px}
.welcome h2{font-size:21px}
.welcome p{margin:3px 0 0;color:var(--muted)}
.empty{color:var(--muted);padding:18px 4px;text-align:center;font-size:13px}
.bars .row{display:grid;grid-template-columns:minmax(90px,34%) 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .row span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bars .row em{font-style:normal;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--slate-l);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .track{flex:1}
.prog em{font-style:normal;font-size:12px;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.legend{display:grid;gap:5px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend b{margin-left:auto;padding-left:14px;font-weight:600}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item:hover .t{color:var(--brand)}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--muted);font-size:12px;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.tools input[type=search],.tools select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.tools input[type=search]{flex:1;min-width:180px;max-width:320px}
.tools .sp{flex:1}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto;box-shadow:var(--sh)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfd}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover{color:var(--ink)}
th .arr{display:inline-block;width:10px;margin-left:3px;color:var(--brand)}
td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#fafcff}
td .t{font-weight:500}
td small{color:var(--muted);display:block;font-size:12px}
td.act{white-space:nowrap;text-align:right}
td.num{font-variant-numeric:tabular-nums}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--muted);font-size:13px}
.badge{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--slate-l);color:var(--ink2)}
.b-blue{background:var(--brand-l);color:var(--brand)} .b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)} .b-red{background:var(--red-l);color:var(--red)}
.b-violet{background:var(--violet-l);color:var(--violet)} .b-gray{background:#f1f5f9;color:#64748b}
.late{color:var(--red);font-weight:500}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#fff;flex:none;border:2px solid #fff}
.av.lg{width:36px;height:36px;font-size:13px;border-color:transparent}
.avs{display:inline-flex}
.avs .av{margin-left:-7px}
.avs .av:first-child{margin-left:0}
.avs .more{background:#e2e8f0;color:#475569}
.person{display:flex;align-items:center;gap:8px;min-width:0}
.person span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sh);min-width:0}
.pcard:hover{border-color:#bcd0ff;box-shadow:0 4px 14px rgba(29,78,216,.08)}
.pcard .hd{display:flex;gap:8px;align-items:flex-start}
.pcard .hd b{flex:1;font-size:15px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.pcard .sub{color:var(--muted);font-size:12.5px}
.pcard .ft{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pcard .ft .sp{flex:1}
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:var(--muted);font-size:13px}
.hero{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.hero .grow{flex:1;min-width:240px}
.hero h2{font-size:21px;margin-bottom:6px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
dl.facts{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0;font-size:13.5px}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
dl.facts dd small{margin-left:6px;color:var(--muted)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tabs button span{background:var(--slate-l);border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px;color:var(--ink2)}
.hist .h{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13px}
.hist .h:last-child{border-bottom:0}
.hist .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px}
.hist small{color:var(--muted);display:block}
.hist .d{color:var(--ink2);overflow-wrap:anywhere}
.hist .d s{color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:680px;box-shadow:0 20px 60px rgba(15,23,42,.3);display:flex;flex-direction:column}
.modal.wide{max-width:860px}
.modal.narrow{max-width:480px}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:16px;flex:1}
.m-b{padding:18px 20px}
.m-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.fld label,.lbl{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:4px}
.fld label i{color:var(--red);font-style:normal}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.tools input:focus,.tools select:focus{outline:2px solid #bfd3ff;border-color:var(--brand)}
.fld input[readonly]{background:#f8fafc;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.picker{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.picker input.q{border:0;border-bottom:1px solid var(--line);border-radius:0;width:100%;padding:7px 10px}
.picker .opts{max-height:150px;overflow:auto;padding:4px}
.pick{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-weight:400}
.pick:hover{background:#f8fafc}
.pick input{width:auto}
.pick small{color:var(--muted);margin-left:auto;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.warn{background:var(--amber-l);border:1px solid #f2d9a6;color:#7c4a03;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.dangerbox{background:var(--red-l);border:1px solid #f5c6c6;color:#7f1d1d;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.okbox{background:var(--green-l);border:1px solid #bfe3c9;color:#14532d;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.radio{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer}
.radio input{margin-top:3px}
.radio b{display:block;font-weight:500}
.radio small{color:var(--muted)}
.cmt{padding:9px 0;border-bottom:1px solid var(--line2)}
.cmt:last-child{border-bottom:0}
.cmt b{font-weight:600;font-size:13px}
.cmt small{color:var(--muted);margin-left:6px}
.update{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.update .rowf{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.update input[type=range]{width:100%}
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:100}
.toast{background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--red)}
.unread td{background:#f7faff}
.unread .t{font-weight:600}
code{background:var(--slate-l);border-radius:4px;padding:1px 5px;font-size:12.5px}
/* sign-in */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(320px,1fr) minmax(360px,1fr)}
.auth-l{background:var(--side);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.auth-l .logo{display:flex;align-items:center;gap:12px}
.auth-l .logo img{width:40px;height:40px;border-radius:9px;background:#fff;padding:4px;object-fit:contain}
.auth-l .logo span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9fb1d3}
.auth-l .logo b{display:block;font-size:17px;letter-spacing:-.01em}
.auth-l h2{font-size:30px;line-height:1.2;font-weight:700;max-width:440px;letter-spacing:-.02em}
.auth-l ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:10px;color:#c3cee3;font-size:14.5px;max-width:420px}
.auth-l li{padding-left:22px;position:relative}
.auth-l li:before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:#4f7cff}
.auth-l small{color:#7f93b8;font-size:12px}
.auth-r{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:var(--bg)}
.auth-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.auth-card h1{font-size:21px;margin-bottom:4px}
.auth-card p.sub{margin:0 0 20px;color:var(--muted)}
.auth-card .fld{margin-bottom:14px}
.auth-card .fld input{padding:10px 12px}
.pw{position:relative}
.pw input{padding-right:64px !important}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);font-size:12.5px;font-weight:500;cursor:pointer;padding:6px}
.auth-card .err{background:var(--red-l);color:#7f1d1d;border:1px solid #f5c6c6;border-radius:8px;padding:9px 11px;font-size:13px;margin-bottom:14px}
.auth-card .foot{margin-top:16px;text-align:center;font-size:13px}
.auth-card .foot button{border:0;background:none;color:var(--brand);cursor:pointer;font-weight:500;padding:4px}
.rules{font-size:12.5px;color:var(--muted);margin:-6px 0 14px;display:grid;gap:2px}
.rules span.ok{color:var(--green)}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--muted);gap:10px}
.loading .spin{border-color:#cbd5e1;border-top-color:var(--brand)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}#bar{transition:none}}
@media (max-width:860px){
  .side{position:fixed;left:-250px;z-index:40;transition:left .2s}
  .side.open{left:0;box-shadow:0 0 0 100vmax rgba(15,23,42,.4)}
  .top .menu-btn{display:inline-flex}
  .top{padding:12px 14px}
  .sync{display:none}
  .content{padding:16px 14px 60px}
  .form{grid-template-columns:1fr}
  dl.facts{grid-template-columns:100px 1fr}
  .auth{grid-template-columns:1fr}
  .auth-l{padding:26px 22px;gap:14px}
  .auth-l h2{font-size:21px}
  .auth-l ul,.auth-l small{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="bar"></div>
<div id="root"><div class="loading"><span class="spin"></span>Loading…</div></div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>

<script>
(function () {
'use strict';
var LOGO = 'https://assets.suraasa.com/logos/v2/mini.webp';

/* ---------- state ---------- */
var S = { me: null, users: [], projects: [], tasks: [], recent: [], unread: 0, meta: {}, view: 'dashboard', param: null, syncedAt: 0,
  f: { tasks: { sort: 'due', dir: 1, page: 1 }, projects: {}, logs: {}, emps: {}, ptab: 'all' },
  logs: null, notifs: null, health: null, trash: null, accounts: null, phist: {}, perf: [] };
var U = {}, P = {}, TOKEN = '';
try { TOKEN = sessionStorage.getItem('sct_session') || ''; } catch (e) {}
function setToken(t) { TOKEN = t || ''; try { if (TOKEN) sessionStorage.setItem('sct_session', TOKEN); else sessionStorage.removeItem('sct_session'); } catch (e) {} }

var ICON = {
  dashboard: '<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  projects: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  tasks: '<path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>',
  mytasks: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

  var el = $('#llist'); if (!el) return;
  if (!S.logs) { el.innerHTML = '<div class="card empty">Loading activity…</div>'; return; }
  var f = S.f.logs, q = (f.q || '').toLowerCase();
  var rows = S.logs.filter(function (l) {
    if (f.type === 'Task' && !l.taskId) return false;
    if (f.type === 'Project' && (l.taskId || !l.projectId)) return false;
    if (f.type === 'Account' && (l.taskId || l.projectId)) return false;
    return !q || (l.action + ' ' + l.taskId + ' ' + l.projectId + ' ' + l.prev + ' ' + l.next + ' ' + l.userName).toLowerCase().indexOf(q) > -1;
  }).slice(0, 300);

}

function closeModal() { var m = $('#modal'); if (!m || !m.innerHTML) return; m.innerHTML = ''; if (lastFocus && document.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} } lastFocus = null; }

function picker(label, name, selected, req) {

    }).join('') + '</div></div></div>';

function readForm() {

  if (T.length) {
    body += '<div class="warn"><b>This project has ' + T.length + ' task' + (T.length === 1 ? '' : 's') + '.</b> Nothing happens to them until you choose:</div>' +
      '<div style="max-height:130px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:12px;font-size:13px">' + T.map(function (t) { return '<div>' + esc(t.id) + ' · ' + esc(t.title) + ' <span style="color:var(--muted)">(' + esc(t.status) + ')</span></div>'; }).join('') + '</div>' +
      (others.length ? '<label class="radio"><input type="radio" name="taskAction" value="move"><span><b>Move the tasks to another project</b><select id="del-move" aria-label="Project to move tasks to" style="margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;max-width:100%">' + opts(others.map(function (x) { return [x.id, x.name + ' (' + x.id + ')']; })) + '</select></span></label>' : '') +
      '<label class="radio"><input type="radio" name="taskAction" value="unlink"><span><b>Keep the tasks without a project</b><small>They stay assigned and visible under Tasks → No project.</small></span></label>' +
      '<label class="radio"><input type="radio" name="taskAction" value="delete"><span><b>Delete the tasks with the project</b><small>Restoring the project brings them back.</small></span></label>';
  }
  body += '<div class="fld" style="margin-top:12px"><label for="del-confirm">Type the Project ID <code>' + esc(p.id) + '</code> to confirm</label><input id="del-confirm" autocomplete="off" placeholder="' + esc(p.id) + '"></div>';
  modal('Delete project?', body, '<button class="btn" data-act="close">Cancel</button><button class="btn danger" id="del-go" data-act="project-del-go" data-id="' + esc(p.id) + '" data-tasks="' + T.length + '" disabled>Delete project</button>');
}
function delGate() {
  var g = $('#del-go'); if (!g) return;
  if (g.getAttribute('data-act') === 'task-del-go') { g.disabled = !$('#del-ok').checked; return; }
  var okId = $('#del-confirm').value.trim() === g.getAttribute('data-id'), needs = Number(g.getAttribute('data-tasks')) > 0;
  g.disabled = !(okId && (!needs || $('#modal input[name=taskAction]:checked')));
}
function empForm(u) {
  var isNew = !u;
  u = u || { email: '', name: '', role: 'Employee', status: 'Active', department: '', designation: '', manager: '', joiningDate: '', id: '' };
  var body = '<div class="form">' + fld('Official email (login ID)', 'email', u.email, { req: true, readonly: !isNew, ph: 'name@suraasa.com', hint: isNew ? 'Password links are sent here. It cannot be changed later.' : 'The login ID cannot be changed.' }) +
    fld('User ID', '_id', isNew ? 'Generated automatically' : (u.id || '—'), { readonly: true }) + fld('Full name', 'name', u.name, { req: true }) + fld('Role', 'role', u.role, { type: 'select', options: S.meta.roles }) +
    fld('Department', 'department', u.department, { type: 'select', options: S.meta.departments, blank: 'None' }) + fld('Designation', 'designation', u.designation) +
    fld('Manager', 'manager', u.manager, { type: 'select', options: S.users.filter(function (x) { return x.email !== u.email; }).map(function (x) { return [x.email, x.name]; }), blank: 'None' }) + fld('Joining date', 'joiningDate', u.joiningDate, { type: 'date' }) +
    fld('Employee status', 'status', u.status, { type: 'select', options: S.meta.userStatuses, hint: 'Only Active people can sign in. Inactive ends their session at once.' }) +
    (isNew ? '<div class="fld"><label>Login</label><label class="pick" style="padding:8px 0"><input type="checkbox" name="invite" checked> Email a password setup link now</label></div>' : '<div></div>') + '</div>';
  modal(isNew ? 'Add Employee' : 'Edit Employee', body, '<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="emp-save" data-new="' + (isNew ? '1' : '') + '" data-rid="' + rid() + '">' + (isNew ? 'Add employee' : 'Save changes') + '</button>');
}
function changePwForm() {
  modal('Change password', '<div id="cp-err"></div>' + ['cp-cur|Current password|current-password', 'cp-new|New password|new-password', 'cp-new2|Type the new password again|new-password'].map(function (s) {
    var p = s.split('|'); return '<div class="fld" style="margin-bottom:12px"><label for="' + p[0] + '">' + p[1] + '</label><input id="' + p[0] + '" type="password" autocomplete="' + p[2] + '"></div>';
  }).join('') + '<div class="hint">At least ' + (S.meta.minPassword || 10) + ' characters, with a letter and a number. You will stay signed in here; other devices are signed out.</div>',
    '<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="change-pw-go">Change password</button>', 'narrow');
}

/* ---------- actions ---------- */
var ACT = {
  go: function (d) { var s = $('#side'); if (s) s.classList.remove('open'); go(d.view); },
  menu: function () { $('#side').classList.toggle('open'); },
  refresh: function (d, btn) { btn.disabled = true; refresh(true, false); },
  close: closeModal,
  overlay: function (d, el, ev) { if (ev.target === el) closeModal(); },
  'show-forgot': showForgot, 'show-login': function () { showLogin(); },
  'pw-toggle': function (d, btn) { var i = document.getElementById(d['for']); i.type = i.type === 'password' ? 'text' : 'password'; btn.textContent = i.type === 'password' ? 'Show' : 'Hide'; i.focus(); },
  'sign-out': function () { call('auth.logout', {}).then(function () {}, function () {}); setToken(''); S.me = null; S.perf = []; showLogin('You have signed out.', true); },
  'change-pw': changePwForm,
  'change-pw-go': function (d, btn) {
    var cur = $('#cp-cur').value, a = $('#cp-new').value, b = $('#cp-new2').value, err = function (m) { $('#cp-err').className = 'dangerbox'; $('#cp-err').setAttribute('role', 'alert'); $('#cp-err').textContent = m; };
    if (!cur) return err('Enter your current password.');
    if (a !== b) return err('The two new passwords do not match.');
    btn.disabled = true;
    call('auth.changePassword', { current: cur, password: a }).then(function (r) { setToken(r.token); closeModal(); toast('Password changed.'); }, function (e) { btn.disabled = false; if (e.code !== 'AUTH') err(e.error); });
  },
  project: function (d, el, ev) { ev.preventDefault(); closeModal(); S.f.ptab = 'all'; go('project', d.id); },
  ptab: function (d) { S.f.ptab = d.tab; viewProject(); },
  page: function (d) { S.f.tasks.page += Number(d.d); taskList(); },
  'project-new': function () { projectForm(null); },
  'project-edit': function (d) { projectForm(P[d.id]); },
  'project-save': projectSave,
  'project-del': function (d) { projectDelete(d.id); },
  'project-del-go': function (d, btn) {
    var a = $('#modal input[name=taskAction]:checked'), pay = { id: d.id, confirm: $('#del-confirm').value.trim() };
    if (a) { pay.taskAction = a.value; if (a.value === 'move') pay.moveTo = $('#del-move').value; }
    btn.disabled = true;
    mutate('project.delete', pay, 'Project deleted').then(function () { closeModal(); go('projects'); }, function () { btn.disabled = false; });
  },
  'project-restore': function (d, btn) { btn.disabled = true; mutate('project.restore', { id: d.id }, 'Project restored').then(render, function () { btn.disabled = false; }); },
  task: function (d) { taskDetail(d.id); },
  'task-new': function (d) { taskForm(null, d.project || ''); },
  'task-edit': function (d, btn) { btn.disabled = true; call('task.detail', { id: d.id }).then(function (r) { btn.disabled = false; taskForm(r.task); }, function (e) { btn.disabled = false; if (e.code !== 'AUTH') toast(e.error, true); }); },
  'task-save': taskSave,
  'task-del': function (d) { taskDelete(d.id); },
  'task-del-go': function (d, btn) { btn.disabled = true; mutate('task.delete', { id: d.id, confirm: true }, 'Task deleted').then(function () { closeModal(); render(); }, function () { btn.disabled = false; }); },
  'task-restore': function (d, btn) { btn.disabled = true; mutate('task.restore', { id: d.id }, 'Task restored').then(render, function () { btn.disabled = false; }); },
  'task-progress': function (d, btn) {
    var t = S.tasks.filter(function (x) { return x.id === d.id; })[0], pay = { id: d.id, comment: $('#up-cmt').value };
    var st = $('#up-status').value, pg = Number($('#up-prog').value);
    if (st !== t.status) pay.status = st;
    if (pg !== t.progress) pay.progress = pg;
    if (!pay.status && pay.progress == null && !pay.comment.trim()) return toast('Nothing to update yet.', true);
    btn.disabled = true;
    mutate('task.progress', pay, 'Update saved').then(function () { render(); taskDetail(d.id); }, function () { btn.disabled = false; });
  },
  'emp-new': function () { empForm(null); },
  'emp-edit': function (d) { empForm(U[d.id]); },
  'emp-save': function (d, btn) {
    var f = readForm(); delete f._id; f.isNew = d['new'] === '1';
    if (!f.email.trim() || !f.name.trim()) return toast('Email and name are required.', true);
    if (f.isNew) f.requestId = d.rid;
    btn.disabled = true;
    mutate('user.save', f, f.isNew ? (f.invite ? 'Employee added and invited' : 'Employee added') : 'Employee updated').then(function () { closeModal(); render(); }, function () { btn.disabled = false; });
  },
  'acc-invite': function (d, btn) { btn.disabled = true; mutate('account.invite', { email: d.id }, 'Setup link emailed to ' + uname(d.id)).then(render, function () { btn.disabled = false; }); },
  'acc-reset': function (d) {
    modal('Reset password?', '<p style="margin:0 0 10px">This cancels the current password of <b>' + esc(uname(d.id)) + '</b>, signs them out everywhere and emails them a link to choose a new one.</p><p class="hint" style="margin:0">You will not see or set their password.</p>',
      '<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="acc-reset-go" data-id="' + esc(d.id) + '">Reset and email link</button>', 'narrow');
  },
  'acc-reset-go': function (d, btn) { btn.disabled = true; mutate('account.reset', { email: d.id }, 'Reset link emailed to ' + uname(d.id)).then(function () { closeModal(); render(); }, function () { btn.disabled = false; }); },
  notif: function (d) {
    var n = (S.notifs || []).filter(function (x) { return x.id === d.id; })[0]; if (!n) return;
    var open = function () {
      if (n.taskId && S.tasks.some(function (t) { return t.id === n.taskId; })) taskDetail(n.taskId);
      else if (n.projectId && P[n.projectId]) go('project', n.projectId);
    };
    if (n.isRead) return open();
    mutate('notifs.read', { id: n.id }).then(function () { render(); open(); }, function () {});
  },
  'notif-all': function (d, btn) { btn.disabled = true; mutate('notifs.read', { all: true }, 'All caught up').then(render, function () { btn.disabled = false; }); },
  'settings-save': function (d, btn) {
    btn.disabled = true;
    mutate('settings.save', { emailNotifications: $('#set-mail').checked, departments: $('#set-depts').value, dailyReminder: $('#set-rem').checked }, 'Settings saved').then(render, function () { btn.disabled = false; });
  },
  'perf-refresh': function () { $('#perf').innerHTML = perfHtml(); }
};

document.addEventListener('click', function (ev) {
  var th = ev.target.closest ? ev.target.closest('th[data-sort]') : null;
  if (th && $('#tlist') && $('#tlist').contains(th)) { var f = S.f.tasks, k = th.getAttribute('data-sort'); if (f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = 1; } f.page = 1; taskList(); return; }
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el || el.disabled) return;
  var inner = ev.target.closest('button,a,input,select,label');
  if (inner && inner !== el && el.contains(inner) && !inner.hasAttribute('data-act')) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el.dataset, el, ev);
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.hasAttribute && el.hasAttribute('data-f')) { var k = el.getAttribute('data-f').split('.'); S.f[k[0]][k[1]] = el.value; LISTS[k[0]](); return; }
  if (el.hasAttribute && el.hasAttribute('data-pickq')) { var q = el.value.toLowerCase(); $$('.pick', el.parentNode).forEach(function (l) { l.style.display = l.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none'; }); return; }
  if (el.id === 'sp-pw' || el.id === 'sp-pw2') checkRules();
  if (el.id === 'up-prog') { $('#up-val').textContent = el.value; var s = $('#up-status'); if (Number(el.value) === 100) s.value = 'Completed'; else if (s.value === 'Completed') s.value = 'In Progress'; else if (Number(el.value) > 0 && s.value === 'Pending') s.value = 'In Progress'; }
  if (el.id === 'up-status' && el.value === 'Completed') { $('#up-prog').value = 100; $('#up-val').textContent = '100'; }
  if (el.id === 'del-confirm' || el.id === 'del-ok' || el.name === 'taskAction') delGate();
});
document.addEventListener('change', function (ev) { if (ev.target.id === 'del-ok' || ev.target.name === 'taskAction' || ev.target.id === 'up-status') ev.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && $('#modal').innerHTML) closeModal();
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('pcard')) ev.target.click();
});

/* ---------- start ---------- */
function boot() {
  $('#root').innerHTML = '<div class="loading"><span class="spin"></span>Loading your workspace…</div>';
  call('boot', {}).then(function (st) { setState(st); render(); }, function (e) {
    setToken('');
    if (e.code === 'SETUP') $('#root').innerHTML = authShell('<h1>Upgrade needed</h1><p class="sub">' + esc(e.error) + '</p>');
    else showLogin(e.code === 'AUTH' ? '' : e.error);
  });
}
function start() {
  if (typeof google === 'undefined' || !google.script) {
    $('#root').innerHTML = authShell('<h1>Open this from the web app link</h1><p class="sub">This page runs inside Google Apps Script. Deploy it as a web app and open the deployment link.</p>');
    return;
  }
  var next = function (code) {
    if (code) {
      $('#root').innerHTML = '<div class="loading"><span class="spin"></span>Checking your link…</div>';
      call('auth.codeInfo', { token: code }).then(function (info) { setToken(''); showSetPassword(code, info); }, function (e) { cleanUrl(); showLogin(e.error); });
    } else if (TOKEN) boot(); else showLogin();
  };
  try { google.script.url.getLocation(function (loc) { next(loc && loc.parameter ? loc.parameter.token : ''); }); } catch (e) { next(''); }
  setInterval(syncLabel, 60000);
  // Quietly pick up other people's changes when you come back to the tab after a while.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && S.me && !$('#modal').innerHTML && busyN === 0 && Date.now() - S.syncedAt > 180000) refresh(false, true); });
}
start();
})();
</script>
